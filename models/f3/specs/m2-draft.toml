# M2: Hooper et al.'s soft maximum on crown Embryophyta, tested with trilete spores (E1).
[spec]
id = "m2-draft"
status = "draft"
maximum = "M2"
event = "E1"
reading = "main"
node = "crown Embryophyta"
max_ma = 459.1
mapping = "Hooper et al. (2026) ancestral-state reading: the crown ancestor produced trilete monads"

[data]
units = "data/units/units.csv"
outcomes = "data/units/outcomes.csv"
units_sha256 = ""
outcomes_sha256 = ""

[first_appearance]
# tau is the base (older boundary) of the oldest stage that contains a certain detection under the
# reading; that stage opens the reference window.
rule = "base-of-oldest-certain-detection-stage"
reference_stages = 5          # Katian to Telychian when tau is the Katian base

[reference]
class_field = "eligibility_class"
min_units_per_class = 10

[older]
domain_ma = [0.0, 560.0]      # lower end set to tau at run time; the upper end lies beyond the oldest unit

[history]
classes = ["H0c", "H0m", "H0", "H1"]
h1_ceiling = 3.0              # H1: any path up to this multiple of the reference intensity, pulses of any duration
h0m_lag_ma = 10.0             # H0m origin read-out: the intensity floor f_min holds up to T - lag, and may be 0 in the last lag Myr

[inference]
# critical value: envelope.count_crit of the older detections in (tau, T] (5.99 with none), plus crit_shift
alpha = 0.05
readouts = [1.0, 0.1, 0.01]
cluster_shape_k = 2.0         # sensitivity values set in the validation grid
crit_shift = 0.0              # added to the critical value; set from the validation study if it asks for one
nodes = 48                    # quadrature nodes in log u for the cluster effect (64 when k < 1)
boundary_model = "fixed-chart"   # stage bases fixed at data/timescale.csv; no age uncertainty is propagated
age_scenario = "chart"        # sensitivity scenarios: "older" (base + printed uncertainty), "younger" (base - uncertainty)
